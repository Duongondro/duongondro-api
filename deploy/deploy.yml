---
# Builds a release locally and deploys it to the shared server, where
# github.com/moroz/shared-infrastructure has set up the duongondro user, service,
# database and environment. The service runs "./server migrate" before it starts.
# As CodeShare's deploy/deploy.yml.

- name: Build and deploy duongondro
  hosts: all
  become: true
  tags: deploy

  vars:
    app_name: duongondro
    app_port: 9000
    public_url: https://api.duongondro.app
    app_base_dir: "/usr/local/lib/{{ app_name }}"
    release_timestamp: "{{ ansible_facts['date_time'].iso8601_basic_short }}"
    target_dir: "{{ app_base_dir }}/releases/{{ release_timestamp }}"
    code_dir: ".."

  tasks:
    - name: Build the release
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.command:
        cmd: deploy/build-release.sh
        chdir: "{{ code_dir }}"
      environment:
        GOOS: "{{ ansible_facts['system'] | lower }}"
        GOARCH: "{{ {'x86_64': 'amd64', 'amd64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64'}[ansible_facts['architecture']] }}"

    - name: Create the release directory
      ansible.builtin.file:
        path: "{{ target_dir }}"
        state: directory
        owner: "{{ ansible_user | default('deploy') }}"
        group: "{{ app_name }}"
        mode: "0751"

    - name: Unpack the release
      ansible.builtin.unarchive:
        src: "{{ code_dir }}/rel/release.tar.gz"
        dest: "{{ target_dir }}"
        owner: "{{ ansible_user | default('deploy') }}"
        group: "{{ app_name }}"

    - name: Make the release current
      ansible.builtin.file:
        src: "{{ target_dir }}"
        dest: "{{ app_base_dir }}/current"
        state: link
        force: true

    - name: Restart duongondro
      ansible.builtin.service:
        name: "{{ app_name }}"
        state: restarted

    - name: Check that duongondro is up
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/healthz"
        status_code: [200]
      register: health
      until: health is succeeded
      retries: 10
      delay: 2

    # From this machine, not the server, so it goes the way the phones do: DNS,
    # Caddy and its certificate included. Retried for a minute: on the first deploy
    # Caddy may still be obtaining the certificate.
    - name: Check that Caddy serves duongondro
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.uri:
        url: "{{ public_url }}/healthz"
        status_code: [200]
      register: public_health
      until: public_health is succeeded
      retries: 12
      delay: 5

- name: Remove old releases
  hosts: all
  become: true
  tags: clean

  vars:
    app_base_dir: /usr/local/lib/duongondro
    keep_releases: 5

  tasks:
    - name: List the releases
      ansible.builtin.find:
        paths: "{{ app_base_dir }}/releases"
        file_type: directory
      register: releases

    - name: Delete all but the newest releases
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ (releases.files | map(attribute='path') | sort(reverse=True))[keep_releases:] }}"
