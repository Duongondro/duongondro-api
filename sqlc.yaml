version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_json_tags: true
        json_tags_case_style: camel
        overrides:
          - db_type: uuid
            go_type: uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: {import: uuid, type: UUID, pointer: true}
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: {import: time, type: Time, pointer: true}
          - db_type: xid8
            go_type: uint64
