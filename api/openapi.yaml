openapi: 3.0.3
info:
  title: Duongöndro API
  version: "1"
  description: |
    The server stores sealed blobs, public keys and signed statements. It never
    receives a practice count, a round or a key, and it checks only sizes, glowie
    curve (NIST P-256) points and Ed25519 signatures over the exact bytes it receives
    (docs/crypto.md). Binary fields are standard base64 (`format: byte`).

    Contract first: edit this file, then `make gen`. The Android client is generated
    from it too.

    Every sign-in ends in a bearer token. Anyone can make an account: a request that
    sets `signUp: true` (with `consent: true`) needs no invitation or admission code,
    and makes an account that is a root of the invite tree and has no friends. Such
    sign-ups are limited per client address, answered 429: five accounts an hour by
    passkey, Apple or Google, and ten magic-link requests an hour. A friend's
    invitation or an admission code (`duongondro-api admit`) still works beside the
    flag, and a request without `signUp` but with one is still a sign-up, as older
    apps send it; signing in never grants keys. The DEV build's POST /api/dev/session is
    registered outside this file, so a release build has no trace of it.
servers:
  - url: https://api.duongondro.app
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          description: The server is up.
          content:
            text/plain:
              schema: {type: string}
  /api/version:
    get:
      operationId: getVersion
      description: The commit the binary was built from, shown in the apps' Settings.
      responses:
        "200":
          description: Build identity.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Version"}

  /api/me:
    get:
      operationId: getMe
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      responses:
        "200":
          description: The signed-in account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    patch:
      operationId: updateMe
      description: |
        Changes the profile: the display name friends see, the username that names
        the account's passkeys (never shown to friends) and the gender friends'
        phones use for grammatical forms. An absent field stays as it is; null clears
        username or gender. 409: the username is taken (case-insensitively). Limited
        to 10 a minute per address, so the 409 cannot be used to list usernames.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MeUpdate"}
      responses:
        "204": {description: Updated.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
    delete:
      operationId: deleteMe
      description: |
        Deletes everything the server holds about this account in one transaction
        (GDPR Article 17); only an anonymous node of the invite tree remains. The
        phone then wipes its own data. Friends drop the person on their next sync,
        since the friend list no longer has them.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/me/export:
    get:
      operationId: exportMe
      description: |
        Everything the server stores about this account, one key per table, sealed
        blobs as base64 (GDPR Articles 15 and 20). The phone decrypts the sealed logs
        itself and builds the export ZIP; this is its server-raw.json. friendships
        lists each friend as the friends list shows them, so it carries the friends'
        display names and genders, data about other people the account can see anyway.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      responses:
        "200":
          description: The server's rows.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/me/session:
    delete:
      operationId: signOut
      description: Ends this session; its token stops working.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      responses:
        "204": {description: Signed out.}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/me/sessions:
    delete:
      operationId: signOutOthers
      description: >-
        Signs out every other session of this account ("sign out everywhere else"), and
        drops the push tokens of every device but the one this session is bound to, so the
        phones signed out stop receiving pushes. A session bound to no device keeps no token;
        the app sends it again.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      responses:
        "204": {description: Signed out.}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/me/identity:
    put:
      operationId: putIdentity
      description: |
        Sets the account's Ed25519 identity public key, once. Setting the same key
        again is a no-op; a different key is refused, since friends have pinned it.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IdentityKey"}
      responses:
        "204": {description: Stored.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/me/device-list:
    get:
      operationId: getDeviceList
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      responses:
        "200":
          description: The newest signed device list.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignedStatement"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      operationId: putDeviceList
      description: |
        Publishes a new signed device list (type `device-list`). The payload must name
        this user, list only devices registered to it with their public keys and
        tiers, carry a version above the stored one, and be signed by the identity key.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignedStatement"}
      responses:
        "204": {description: Stored.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/me/key-rotations:
    post:
      operationId: rotatePracticeKey
      description: |
        Moves the practice key to keyVersion + 1. The wraps must carry the new key to
        exactly the devices that hold the current one, and userKeyWrap to the user key
        while it holds the current one. Logs sealed under the old
        version are then refused with 422 until the devices reseal them.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KeyRotation"}
      responses:
        "204": {description: Rotated.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/me/recovery-boxes:
    get:
      operationId: listRecoveryBoxes
      description: The practice key and identity seed sealed under the recovery code.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      responses:
        "200":
          description: Stored boxes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecoveryBoxList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/me/recovery-boxes/{kind}:
    put:
      operationId: putRecoveryBox
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/Kind"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecoveryBoxInput"}
      responses:
        "204": {description: Stored.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/devices:
    get:
      operationId: listDevices
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      responses:
        "200":
          description: This account's devices.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeviceList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      operationId: registerDevice
      description: Registers a device key; registering the same key again returns the existing device.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeviceInput"}
      responses:
        "200":
          description: Already registered.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Device"}
        "201":
          description: Registered.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Device"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/devices/{deviceId}:
    delete:
      operationId: deleteDevice
      description: Removes one of this account's devices, its wraps, its push token and the sessions it registered.
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/DeviceId"}
      responses:
        "204": {description: Removed.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/devices/{deviceId}/wraps:
    get:
      operationId: listWraps
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/DeviceId"}
      responses:
        "200":
          description: Secrets wrapped to this device.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WrapList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      operationId: putWrap
      description: |
        Stores a wrap to one of this account's devices, replacing one of the same kind
        and version. A signature authenticator is verified against the identity key
        over the wrap and the AAD the server rebuilds; HMAC tags are checked for size.
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/DeviceId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WrapInput"}
      responses:
        "204": {description: Stored.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/practice-logs/{logId}:
    put:
      operationId: putPracticeLog
      description: |
        Stores a sealed session, or its deletion, if it is newer (by the client's
        updatedAt) than the stored one; either way the answer is the stored row.
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - name: logId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/UUID"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PracticeLogInput"}
      responses:
        "200":
          description: The stored log.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PracticeLog"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422":
          description: Sealed under an old practice key; reseal under currentKeyVersion.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OldKeyError"}
  /api/sync:
    get:
      operationId: sync
      description: |
        Logs changed since the cursor (all of them with no cursor, or when the cursor
        belongs to another database generation: then `full` is true and the client
        replaces its view). Deleted logs come back without `sealed`.
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - name: since
          in: query
          required: false
          schema: {type: string, maxLength: 64}
      responses:
        "200":
          description: Changes and the next cursor.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/invites:
    get:
      operationId: listInvites
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      responses:
        "200":
          description: Invites this account created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InviteList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      operationId: createInvite
      description: |
        Stores a reusable invitation: the inviter's signed invite statement, the pin
        MAC the invitee checks, and auth, of which the server keeps only a hash.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InviteInput"}
      responses:
        "201": {description: Created.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/invites/{inviteId}:
    get:
      operationId: getInvite
      description: |
        A live invite, for the invitee's app to check (the signature, then the pin
        MAC) before redeeming. Needs no session: the invitee has none yet.
        Rate-limited per address.
      parameters: [{$ref: "#/components/parameters/InviteId"}]
      responses:
        "200":
          description: The invite record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InviteRecord"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
    delete:
      operationId: revokeInvite
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/InviteId"}
      responses:
        "204": {description: Revoked.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/invites/{inviteId}/redemptions:
    post:
      operationId: redeemInvite
      description: |
        Makes this account and the inviter friends. auth proves the link's secret; the
        acceptance, signed by this account's identity key, names the invite, the
        account and its key. A wrong auth answers 404 like an unknown invite.
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/InviteId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Redemption"}
      responses:
        "200":
          description: Now friends.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RedemptionResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}

  /api/friends:
    get:
      operationId: listFriends
      description: The authoritative friend list; a phone drops anyone cached who is not in it.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      responses:
        "200":
          description: Friends.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FriendList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/friends/streaks:
    get:
      operationId: friendsStreaks
      description: The newest signed statement of every public practice of every friend.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      responses:
        "200":
          description: Statements to verify against each friend's pinned key.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StreakList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/friends/{userId}:
    delete:
      operationId: unfriend
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/UserId"}
      responses:
        "204": {description: No longer friends, both ways.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/blocks:
    get:
      operationId: listBlocks
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      responses:
        "200":
          description: People this account has blocked.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BlockList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/blocks/{userId}:
    put:
      operationId: block
      description: Ends any friendship and keeps it from coming back, both ways.
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/UserId"}
      responses:
        "204": {description: Blocked.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: unblock
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/UserId"}
      responses:
        "204": {description: Unblocked.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/reports:
    post:
      operationId: report
      description: Reports a friend, or someone this account blocked, for moderation.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReportInput"}
      responses:
        "201":
          description: Filed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReportResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/streaks:
    get:
      operationId: ownStreaks
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      responses:
        "200":
          description: This account's public streak statements.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StreakList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/streaks/{practice}:
    put:
      operationId: putStreak
      description: |
        Publishes a signed streak statement (type `streak`) for one practice: tracked
        days only, a seq above the stored one, and a deadline the server times
        streak-at-risk pushes by.
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/Practice"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignedStatement"}
      responses:
        "204": {description: Stored.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      operationId: deleteStreak
      description: Makes the practice's streak private again.
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/Practice"}
      responses:
        "204": {description: Removed.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/auth/passkeys/sign-up:
    post:
      operationId: beginPasskeySignUp
      description: |
        Starts creating an account with a passkey; the invitation or admission code is
        checked now and when it finishes. 404: no such live invitation, or the code is
        wrong, spent or expired. With `signUp: true` and neither, an open sign-up: 429
        when this address has made five such accounts within the hour (checked now,
        counted when the ceremony finishes). Without `signUp` and without an invitation or
        code: 400, as before. The optional profile (as PATCH /api/me takes it) is
        set on the account when it is made and names the passkey; an account made
        without a display name, by any sign-up, gets a random English name ("Adjective
        Animal", e.g. "Tidy Otter"); for a passkey it is drawn now, so it is also the
        name in the options' `user` (`name` too, unless a username is given) and
        labels the passkey in the password manager. 409: the username is
        taken, now or by the time the ceremony finishes.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeySignUp"}
      responses:
        "200":
          description: Options for the platform authenticator.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ceremony"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/auth/passkeys/sign-in:
    post:
      operationId: beginPasskeySignIn
      description: Starts a discoverable sign-in; the phone offers its passkeys.
      responses:
        "200":
          description: Options for the platform authenticator.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ceremony"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/auth/passkeys/{sessionId}:
    post:
      operationId: finishPasskey
      description: |
        Completes a passkey sign-up or sign-in with the authenticator's response. For
        an open sign-up: 429 if this address made five accounts without an invitation
        within the hour.
      parameters: [{$ref: "#/components/parameters/CeremonyId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeyResponse"}
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignInResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/auth/nonces:
    post:
      operationId: newNonce
      description: |
        A single-use nonce for an Apple or Google sign-in, valid ten minutes. The app
        passes it to the provider (Apple takes its SHA-256 in hex) and back here.
      responses:
        "200":
          description: The nonce.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Nonce"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/auth/providers/{provider}:
    post:
      operationId: providerSignIn
      description: |
        Signs in with a Sign in with Apple or Google ID token; with an invitation or
        admission code, or `signUp: true`, and no account for that provider account,
        creates one (an existing account is signed in, `created: false`). 403 means no
        account uses it and the request is no sign-up (neither `signUp: true` nor an
        invitation or code). 429 also when this address made five accounts without an
        invitation within the hour.
      parameters: [{$ref: "#/components/parameters/Provider"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderSignIn"}
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignInResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/auth/magic-links:
    post:
      operationId: requestMagicLink
      description: |
        Mails a single-use sign-in link (15 minutes) and an 8-character code that
        does the same when typed into the app, shown as XXXX XXXX. A newer request
        for the address makes the older codes unusable; older links still work until
        used or expired. The answer is the
        same whether or not an account uses the address, which therefore is never
        revealed. With an invitation or code, or with `signUp: true`, the mail goes
        out to an address without an account too, and the link makes the account;
        without any of them, only to an address with one. 429: three mails per address per 15 minutes; or, for a request
        with `signUp: true` and no invitation or code, ten such requests an hour from
        this client address, each counted whether or not the address has an account
        (so the answer reveals nothing about it); or the sign-in routes' limit.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MagicLinkRequest"}
      responses:
        "204": {description: Sent, or nothing to send.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/auth/magic-links/redeem:
    post:
      operationId: redeemMagicLink
      description: |
        Signs in with the link's token, or with the address and the code from the
        mail. A wrong code counts against the newest mail's code; the fifth kills that
        code, though not its link. A server restart invalidates codes mailed before
        it (their links keep working): ask for a new mail. A wrong, expired, used or
        replaced code gets the same status and body (400) whether or not the address
        has a pending code; response times may still differ.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MagicLinkRedemption"}
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignInResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/me/passkeys:
    post:
      operationId: beginPasskeyAdd
      description: Starts adding a passkey to this account.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      responses:
        "200":
          description: Options for the platform authenticator.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ceremony"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/me/passkeys/{sessionId}:
    post:
      operationId: finishPasskeyAdd
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/CeremonyId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeyResponse"}
      responses:
        "204": {description: Added.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/me/credentials:
    get:
      operationId: listPasskeys
      description: |
        The account's passkeys, oldest first, for Settings › Passkeys (design decision
        25). No key material: a name if the person gave one, the authenticator's AAGUID
        (the app names the passkey after its password manager), when it was added and
        last used, and whether this session signed in with it.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      responses:
        "200":
          description: Passkeys.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PasskeyList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/me/credentials/{credentialId}:
    patch:
      operationId: renamePasskey
      description: Names a passkey, or clears its name (null or blank). The name is encrypted at rest.
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/CredentialId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeyRename"}
      responses:
        "204": {description: Renamed.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deletePasskey
      description: |
        Removes a passkey and ends every session it signed in with, this one included
        if it did. Sessions made before the deploy that records each session's passkey
        (sessions.credential_id) are tied to none: removing a passkey does not end
        them, and they never see current true; "sign out everywhere
        else" (DELETE /api/me/sessions) ends them.
        409 when it is the account's last way to sign in (no other passkey,
        e-mail, Apple or Google identity). The passkey stays in the password manager.
        Its box goes with it, but removal is not revocation: a U this passkey already
        opened stays open to whoever opened it. When the passkey's canUnlock was true,
        the app offers to replace U (PUT /api/me/user-key with replace) and rotate the
        practice key (docs/crypto.md › Passkey unlock).
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/CredentialId"}
      responses:
        "204": {description: Removed.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/me/credentials/{credentialId}/unlock:
    get:
      operationId: getPasskeyUnlock
      description: |
        What a new phone needs after signing in with this passkey (docs/crypto.md ›
        Passkey unlock): the user key's signed statement, the passkey's box holding
        U's scalar, and the practice key and identity seed wrapped to U. 404 when the
        passkey is not this account's or cannot unlock the counts.
        The box's AAD binds the account's identity public key (GET /api/me): open the
        box with it first, and trust the statement and wraps only if it opens.
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/CredentialId"}
      responses:
        "200":
          description: The passkey's box and the user key.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PasskeyUnlock"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      operationId: putPasskeyUnlock
      description: |
        Stores U's scalar sealed under this passkey's PRF output, replacing its box.
        The signature by the identity key is verified over the AAD the server rebuilds
        (user, identity public key, current user key, credential id). 409 when no user key is published or
        userKeyId is not the current one.
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/CredentialId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeyBoxInput"}
      responses:
        "204": {description: Stored.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      operationId: deletePasskeyUnlock
      description: |
        Stops the server handing out this passkey's box. The passkey itself stays. Not
        a revocation: to shut out a U already opened, replace U and rotate.
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/CredentialId"}
      responses:
        "204": {description: Removed.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/me/user-key:
    get:
      operationId: getUserKey
      description: The user key U's signed statement and the wraps to it; 404 when none is published.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      responses:
        "200":
          description: The user key.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserKeyState"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      operationId: putUserKey
      description: |
        Publishes the user key U (type `user-key`): a conditional create, never an
        implicit replacement (docs/crypto.md › Passkey unlock). The payload must name
        this user, carry a lowercase UUID id, a 65-byte point on the glowie curve and
        a version of at least 1, and be signed by the identity key.

        - No U yet: stored, 201. The first phone wins.
        - A U exists: 409 with `userKey` (its id and version), and nothing changes.
          The phone keeps no U of its own and waits for the existing one to reach it
          as a kind 4 wrap from a phone that holds it.
        - The same statement as the stored one again: 201 (a safe retry).
        - `replace: true`, for when U is lost (no phone holds it) or may be
          compromised (a passkey that could unlock it was removed): replaces U only
          when this session is bound to a device holding the current practice key,
          and the new U has a new id and a version above the stored one's; else 409
          without `userKey`. Replacing deletes every passkey box and wrap to the old
          U, and its kind 4 wraps to the account's devices.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserKeyInput"}
      responses:
        "201": {description: "Stored: U is now this statement's key."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: |
            The account already has a U (`userKey` is present), or a replacement or
            precondition was refused (identity key not set, the session's device does
            not hold the current practice key, the version is not above the stored
            one's).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserKeyConflict"}
  /api/me/user-key/wraps:
    post:
      operationId: putUserKeyWrap
      description: |
        Stores the practice key or identity seed wrapped to the current U, replacing
        one of the same kind and version. Signed by the identity key over the wrap and
        the AAD the server rebuilds with U in the recipient's place. A practice key
        (kind 1) only at the current key version: 409 otherwise, as when no U is
        published or userKeyId is not the current U.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserKeyWrapInput"}
      responses:
        "204": {description: Stored.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/me/identities/{provider}:
    post:
      operationId: linkProvider
      description: Adds an Apple or Google account to this account. Linking is only ever explicit, like this.
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/Provider"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderLink"}
      responses:
        "204": {description: Linked.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/me/email:
    post:
      operationId: requestEmailConfirmation
      description: |
        Starts adding an e-mail address to this account, as a second way to sign in
        (by magic link). Mails the address a single-use 8-character code (15
        minutes), shown as XXXX XXXX, for typing into the app (POST
        /api/me/email/verify). A confirmation link,
        `https://duongondro.app/m/e#<token>` (the sign-in link's base, with `/e`
        before the fragment), for the app to open with this account's session, is
        defined and accepted by verify, but the mail leaves it out until the apps
        handle it.
        A newer mail for this account makes its older codes unusable, as does any
        newer mail to the address; older links still work until used or expired.
        The answer is the same whether or not another account uses the address,
        which therefore is not revealed here (verifying tells, with 409). An address
        this account already has is answered 204 without a mail. 429: three mails
        per address per 15 minutes (sign-in mails included), five confirmation
        requests per account an hour, or ten mails an hour from this client address
        (confirmations and open magic-link sign-ups together).
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmailRequest"}
      responses:
        "204": {description: Sent, or the account already has the address.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
    delete:
      operationId: removeEmail
      description: |
        Removes this account's e-mail address; it no longer signs in. 409 when it is
        the account's only way to sign in (no passkey, Apple or Google): add one
        first. Removing an address the account does not have is a no-op. It ends no
        session, not even those signed in with the address. 429 on this and
        verify: more than 20 requests a minute to /api/me/email from this client
        address.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      responses:
        "204": {description: Removed.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/me/email/verify:
    post:
      operationId: confirmEmail
      description: |
        Confirms the address with the code from the mail, typed, or the link's token,
        by the account that asked for it, and makes it this account's e-mail sign-in,
        replacing the previous address, if any. A wrong code counts against the
        newest confirmation mail's code; the fifth kills that code, though not its
        link. A wrong, expired, used or replaced code or token is 400, as is one
        mailed before a server restart (ask for a new mail). 409: another account
        signs in with this address (the mail proved this person controls it, so
        saying so reveals nothing to them). A 409 or a server error leaves the code
        or link unspent. Replacing the address ends no session.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmailConfirmation"}
      responses:
        "204": {description: The address now signs in to this account.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}

  /api/devices/{deviceId}/push-token:
    put:
      operationId: putPushToken
      description: Stores this device's APNs or FCM token; the server drops it when the provider reports it unregistered.
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/DeviceId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PushTokenInput"}
      responses:
        "204": {description: Stored.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deletePushToken
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/DeviceId"}
      responses:
        "204": {description: Removed.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/friends/{userId}/settings:
    put:
      operationId: putFriendSettings
      description: Opts in or out of "done today" pushes from this friend.
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/UserId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FriendSettings"}
      responses:
        "204": {description: Stored.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/friends/{userId}/pokes:
    post:
      operationId: poke
      description: A manual nudge, one per friend per UTC day; the phone writes it in the mascot's voice.
      parameters:
        - {$ref: "#/components/parameters/Authorization"}
        - {$ref: "#/components/parameters/UserId"}
      responses:
        "204": {description: Sent.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/client-errors:
    post:
      operationId: reportClientError
      description: |
        A crash or error the app reports about itself, such as a device-key fallback
        to the software tier on a broken Keystore. Logged with the user id and nothing
        else about them; nothing is stored. 30 per user per hour.
      parameters: [{$ref: "#/components/parameters/Authorization"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientErrorReport"}
      responses:
        "204": {description: Logged.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/TooManyRequests"}

components:
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      description: Bearer <session token>
      schema: {type: string}
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUID"}
    CeremonyId:
      name: sessionId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUID"}
    CredentialId:
      name: credentialId
      in: path
      required: true
      description: The passkey's credential id, base64url without padding.
      schema: {type: string, minLength: 1, maxLength: 1400}
    Provider:
      name: provider
      in: path
      required: true
      schema: {type: string, enum: [apple, google]}
    InviteId:
      name: inviteId
      in: path
      required: true
      description: 8 Crockford base32 characters; either case.
      schema: {type: string, minLength: 8, maxLength: 8}
    UserId:
      name: userId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUID"}
    Practice:
      name: practice
      in: path
      required: true
      schema: {type: string, maxLength: 64}
    Kind:
      name: kind
      in: path
      required: true
      description: 1 = practice key, 2 = identity seed.
      schema: {type: integer, minimum: 1, maximum: 2}

  responses:
    Unauthorized:
      description: Missing, unknown or revoked session token.
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: No such resource for this account.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: "No account uses this sign-in, and the request was no sign-up; send `signUp: true` (with `consent: true`) to create one."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TooManyRequests:
      description: Rate-limited; try again later.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: Conflicts with the stored state.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    UUID:
      type: string
      format: uuid
      x-go-type: uuid.UUID
      x-go-type-import: {path: uuid}
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
    Version:
      type: object
      required: [revision, short, modified, go]
      properties:
        revision: {type: string}
        short: {type: string, description: "7 characters, with -dirty for a modified tree"}
        modified: {type: boolean}
        time: {type: string}
        go: {type: string}
    Me:
      type: object
      required: [id, keyVersion, displayName, devices]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        identityPublicKey: {type: string, format: byte, description: Ed25519, 32 bytes}
        keyVersion: {type: integer, description: Current version of the practice key}
        displayName:
          type: string
          description: |
            Set for every account: a random English name ("Adjective Animal", e.g.
            "Tidy Otter") when none was given at sign-up, and accounts from before
            random names were given one too. Empty only if the person cleared it.
        username: {type: string, description: "Absent until set; lowercase"}
        gender: {$ref: "#/components/schemas/Gender"}
        email: {type: string, description: "The address that signs in by magic link; absent if none. Normalised (lower case)."}
        devices:
          type: array
          items: {$ref: "#/components/schemas/Device"}
    IdentityKey:
      type: object
      required: [publicKey]
      properties:
        publicKey: {type: string, format: byte, description: Ed25519, 32 bytes}
    SignedStatement:
      type: object
      required: [payload, signature]
      description: Exact payload bytes (compact JSON, sorted keys) and their Ed25519 signature.
      properties:
        payload: {type: string, format: byte}
        signature: {type: string, format: byte}
    UserKeyInput:
      type: object
      required: [payload, signature]
      description: A signed `user-key` statement (as SignedStatement), and whether it may replace a stored U.
      properties:
        payload: {type: string, format: byte}
        signature: {type: string, format: byte}
        replace:
          type: boolean
          default: false
          description: "Replace an existing U (lost, or compromised). Only from a session bound to a device holding the current practice key; never implied."
    UserKeyConflict:
      type: object
      required: [error]
      properties:
        error: {type: string}
        userKey:
          type: object
          description: Present when the account already has a U; the phone waits for it as a kind 4 wrap.
          required: [id, version]
          properties:
            id: {$ref: "#/components/schemas/UUID"}
            version: {type: integer, format: int64}
    Tier:
      type: string
      enum: [hardware, tee, software]
    DeviceInput:
      type: object
      required: [publicKey, tier]
      properties:
        publicKey: {type: string, format: byte, description: "65-byte uncompressed point on the glowie curve"}
        tier: {$ref: "#/components/schemas/Tier"}
    Device:
      type: object
      required: [id, publicKey, tier, createdAt]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        publicKey: {type: string, format: byte}
        tier: {$ref: "#/components/schemas/Tier"}
        createdAt: {type: string, format: date-time}
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items: {$ref: "#/components/schemas/Device"}
    AuthType:
      type: string
      enum: [signature, enrol, self]
      description: |
        signature: Ed25519 by the identity key; enrol: HMAC from the QR secret; self:
        HMAC from the device's own ECDH (docs/crypto.md, Wraps).
    WrapInput:
      type: object
      required: [kind, keyVersion, ephemeralKey, box, authType, authenticator]
      properties:
        kind: {type: integer, minimum: 1, maximum: 4, description: "1 practice key, 2 identity seed, 4 user key (signed, keyVersion = the user key's version); not 3"}
        keyVersion: {type: integer, minimum: 1}
        ephemeralKey: {type: string, format: byte, description: 65 bytes}
        box: {type: string, format: byte, description: "nonce ‖ ciphertext ‖ tag, 60 bytes"}
        authType: {$ref: "#/components/schemas/AuthType"}
        authenticator: {type: string, format: byte, description: "64 bytes for a signature, 32 for a tag"}
    Wrap:
      allOf:
        - {$ref: "#/components/schemas/WrapInput"}
        - type: object
          required: [deviceId, createdAt]
          properties:
            deviceId: {$ref: "#/components/schemas/UUID"}
            createdAt: {type: string, format: date-time}
    WrapList:
      type: object
      required: [wraps]
      properties:
        wraps:
          type: array
          items: {$ref: "#/components/schemas/Wrap"}
    RotationWrap:
      allOf:
        - {$ref: "#/components/schemas/WrapInput"}
        - type: object
          required: [deviceId]
          properties:
            deviceId: {$ref: "#/components/schemas/UUID"}
    KeyRotation:
      type: object
      required: [newVersion, wraps]
      properties:
        newVersion: {type: integer, minimum: 2}
        wraps:
          type: array
          items: {$ref: "#/components/schemas/RotationWrap"}
        userKeyWrap: {$ref: "#/components/schemas/UserKeyWrapInput"}
    UserKeyWrapInput:
      type: object
      required: [userKeyId, kind, keyVersion, ephemeralKey, box, signature]
      properties:
        userKeyId: {$ref: "#/components/schemas/UUID"}
        kind: {type: integer, minimum: 1, maximum: 2}
        keyVersion: {type: integer, minimum: 1}
        ephemeralKey: {type: string, format: byte, description: 65 bytes}
        box: {type: string, format: byte, description: "nonce ‖ ciphertext ‖ tag, 60 bytes"}
        signature: {type: string, format: byte, description: "Ed25519 by the identity key (docs/crypto.md, Wraps)"}
    UserKeyWrap:
      allOf:
        - {$ref: "#/components/schemas/UserKeyWrapInput"}
        - type: object
          required: [createdAt]
          properties:
            createdAt: {type: string, format: date-time}
    UserKeyState:
      type: object
      required: [id, version, statement, wraps]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        version: {type: integer, format: int64}
        statement: {$ref: "#/components/schemas/SignedStatement"}
        wraps:
          type: array
          items: {$ref: "#/components/schemas/UserKeyWrap"}
    PasskeyBoxInput:
      type: object
      required: [userKeyId, box, signature]
      properties:
        userKeyId: {$ref: "#/components/schemas/UUID"}
        box: {type: string, format: byte, description: "U's scalar sealed under the PRF key, 60 bytes"}
        signature: {type: string, format: byte, description: "Ed25519 by the identity key over prf-sig ‖ aad ‖ box (docs/crypto.md)"}
    PasskeyUnlock:
      type: object
      required: [userKey, box, signature]
      properties:
        userKey: {$ref: "#/components/schemas/UserKeyState"}
        box: {type: string, format: byte}
        signature: {type: string, format: byte}
    RecoveryBoxInput:
      type: object
      required: [box, signature]
      properties:
        box: {type: string, format: byte, description: 60 bytes}
        signature: {type: string, format: byte, description: "Ed25519 by the identity key over recovery-sig ‖ user ‖ kind ‖ box (docs/crypto.md)"}
    RecoveryBox:
      type: object
      required: [kind, box, updatedAt]
      properties:
        kind: {type: integer}
        box: {type: string, format: byte}
        updatedAt: {type: string, format: date-time}
    RecoveryBoxList:
      type: object
      required: [boxes]
      properties:
        boxes:
          type: array
          items: {$ref: "#/components/schemas/RecoveryBox"}
    PracticeLogInput:
      type: object
      required: [sealed, keyVersion, updatedAt]
      properties:
        sealed:
          type: string
          format: byte
          description: |
            nonce ‖ ciphertext ‖ tag over the padded session JSON (a multiple of 256
            bytes, at most 16 KiB). A deletion is sealed too: a tombstone whose json
            carries deletedAt, sent with deleted: true.
        keyVersion: {type: integer, minimum: 1}
        updatedAt: {type: string, format: date-time, description: "The client's clock, at most 5 minutes ahead of the server's; the newer write wins"}
        deleted: {type: boolean}
    PracticeLog:
      type: object
      required: [id, keyVersion, updatedAt]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        sealed: {type: string, format: byte}
        keyVersion: {type: integer}
        updatedAt: {type: string, format: date-time}
        deletedAt: {type: string, format: date-time}
    OldKeyError:
      type: object
      required: [error, currentKeyVersion]
      properties:
        error: {type: string}
        currentKeyVersion: {type: integer}
    SyncResponse:
      type: object
      required: [cursor, full, logs]
      properties:
        cursor: {type: string, description: "<generation>:<xid>; pass back as since"}
        full: {type: boolean}
        logs:
          type: array
          items: {$ref: "#/components/schemas/PracticeLog"}
    Gender:
      type: string
      enum: [male, female, nonbinary]
      description: Absent when not given.
    MeUpdate:
      type: object
      description: Absent fields stay as they are; null clears username or gender.
      properties:
        displayName: {type: string, maxLength: 64}
        username:
          type: string
          nullable: true
          minLength: 3
          maxLength: 32
          description: "3 to 32 of a-z, 0-9, dot and underscore; stored lowercased, unique regardless of case"
        gender:
          type: string
          nullable: true
          enum: [male, female, nonbinary]
    InviteInput:
      type: object
      required: [id, auth, expiresAt, payload, signature, mac]
      properties:
        id: {type: string, minLength: 8, maxLength: 8}
        auth: {type: string, format: byte, description: "HKDF(secret, invite-auth), 32 bytes"}
        expiresAt: {type: string, format: date-time}
        payload: {type: string, format: byte, description: The signed invite statement}
        signature: {type: string, format: byte}
        mac: {type: string, format: byte, description: "HMAC(pin, inviterIdentityPk), 32 bytes"}
    InviteRecord:
      type: object
      required: [id, payload, signature, mac, expiresAt]
      properties:
        id: {type: string}
        payload: {type: string, format: byte}
        signature: {type: string, format: byte}
        mac: {type: string, format: byte}
        expiresAt: {type: string, format: date-time}
    InviteSummary:
      type: object
      required: [id, expiresAt, createdAt]
      properties:
        id: {type: string}
        expiresAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    InviteList:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items: {$ref: "#/components/schemas/InviteSummary"}
    Redemption:
      type: object
      required: [auth, acceptance]
      properties:
        auth: {type: string, format: byte}
        acceptance: {$ref: "#/components/schemas/SignedStatement"}
    RedemptionResult:
      type: object
      required: [inviterId]
      properties:
        inviterId: {$ref: "#/components/schemas/UUID"}
    Friend:
      type: object
      required: [userId, displayName, since, notifyDone]
      properties:
        userId: {$ref: "#/components/schemas/UUID"}
        displayName: {type: string}
        gender: {$ref: "#/components/schemas/Gender"}
        notifyDone: {type: boolean, description: This account hears when the friend practises}
        identityPublicKey: {type: string, format: byte}
        since: {type: string, format: date-time}
    FriendList:
      type: object
      required: [friends]
      properties:
        friends:
          type: array
          items: {$ref: "#/components/schemas/Friend"}
    BlockEntry:
      type: object
      required: [userId, createdAt]
      properties:
        userId: {$ref: "#/components/schemas/UUID"}
        createdAt: {type: string, format: date-time}
    BlockList:
      type: object
      required: [blocks]
      properties:
        blocks:
          type: array
          items: {$ref: "#/components/schemas/BlockEntry"}
    ReportInput:
      type: object
      required: [userId, reason]
      properties:
        userId: {$ref: "#/components/schemas/UUID"}
        reason: {type: string, maxLength: 1000}
    ReportResult:
      type: object
      required: [id]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
    StreakStatement:
      type: object
      required: [userId, practice, payload, signature]
      properties:
        userId: {$ref: "#/components/schemas/UUID"}
        practice: {type: string}
        payload: {type: string, format: byte}
        signature: {type: string, format: byte}
    StreakList:
      type: object
      required: [streaks]
      properties:
        streaks:
          type: array
          items: {$ref: "#/components/schemas/StreakStatement"}
    InviteProof:
      type: object
      required: [id, auth]
      description: The invitation a sign-up presents.
      properties:
        id: {type: string, minLength: 8, maxLength: 8}
        auth: {type: string, format: byte}
    AdmissionCode:
      type: string
      maxLength: 64
      description: |
        A bootstrap admission code, 16 Crockford base32 characters, single use. Read
        leniently: case, spaces and hyphens are ignored, O is read as 0 and I and L as 1.
        The account it makes has no inviter.
    SignUp:
      type: boolean
      description: |
        This request starts a sign-up: create an account if none uses this sign-in.
        Needed for a sign-up without an invitation or admission code; optional with
        one, which still makes a request a sign-up on its own (older
        apps send no flag). false is the same as absent. Requires `consent: true`.
    Consent:
      type: boolean
      description: |
        The person ticked the onboarding consent to processing data that reveals
        religious belief (GDPR Art. 9). Required, and must be true, with
        `signUp: true` (400 otherwise); nothing is created without it. Not stored.
    PasskeySignUp:
      type: object
      description: |
        At most one of invite and admissionCode; neither only with signUp (an open
        sign-up). Optionally the profile.
      properties:
        signUp: {$ref: "#/components/schemas/SignUp"}
        consent: {$ref: "#/components/schemas/Consent"}
        invite: {$ref: "#/components/schemas/InviteProof"}
        admissionCode: {$ref: "#/components/schemas/AdmissionCode"}
        username:
          type: string
          minLength: 3
          maxLength: 32
          description: "3 to 32 of a-z, 0-9, dot and underscore; stored lowercased, unique regardless of case"
        displayName:
          type: string
          maxLength: 64
          description: |
            Optional; absent or blank gives the account a random English name
            ("Adjective Animal", e.g. "Tidy Otter"), as every sign-up without one gets,
            drawn when the ceremony begins so that it names the passkey too.
        gender: {$ref: "#/components/schemas/Gender"}
    Passkey:
      type: object
      required: [id, createdAt, current, canUnlock]
      properties:
        id: {type: string, description: "Credential id, base64url without padding"}
        name: {type: string, description: Absent when the person has not named it}
        aaguid: {type: string, description: "The authenticator's AAGUID, absent when it gave none (all zeros)"}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: string, format: date-time}
        current: {type: boolean, description: "This session signed in with this passkey, so removing it signs this phone out"}
        canUnlock: {type: boolean, description: "It holds a box of the user key, so signing in with it brings the keys to a new phone"}
    PasskeyList:
      type: object
      required: [passkeys]
      properties:
        passkeys:
          type: array
          items: {$ref: "#/components/schemas/Passkey"}
    PasskeyRename:
      type: object
      required: [name]
      properties:
        name: {type: string, nullable: true, maxLength: 64, description: "Characters, trimmed; null or blank clears the name"}
    Ceremony:
      type: object
      required: [sessionId, options]
      properties:
        sessionId: {$ref: "#/components/schemas/UUID"}
        options:
          type: object
          additionalProperties: true
          description: WebAuthn creation or request options, for the platform authenticator
    PasskeyResponse:
      type: object
      required: [credential]
      properties:
        credential:
          type: object
          additionalProperties: true
          description: |
            The authenticator's PublicKeyCredential as WebAuthn JSON (base64url
            fields), without any PRF output: the phone removes clientExtensionResults (at least prf) before sending it, and
            a response carrying prf.results is refused with 400 (docs/crypto.md ›
            Passkey unlock). The server's options never ask for PRF; the phone adds
            the extension itself.
    SignInResult:
      type: object
      required: [token, userId, created]
      properties:
        token: {type: string, description: "Bearer token; send as Authorization: Bearer <token>"}
        userId: {$ref: "#/components/schemas/UUID"}
        created: {type: boolean, description: A new account was made (with the invitation, the admission code, or by open sign-up)}
    ProviderSignIn:
      type: object
      required: [idToken, nonce]
      properties:
        idToken: {type: string, maxLength: 8192}
        nonce: {type: string, maxLength: 256, description: The raw nonce the app gave the provider}
        authorizationCode: {type: string, maxLength: 1024, description: "Apple only: kept to revoke the authorisation when the account is deleted"}
        invite: {$ref: "#/components/schemas/InviteProof"}
        admissionCode: {$ref: "#/components/schemas/AdmissionCode"}
        signUp: {$ref: "#/components/schemas/SignUp"}
        consent: {$ref: "#/components/schemas/Consent"}
    ProviderLink:
      type: object
      required: [idToken, nonce]
      properties:
        idToken: {type: string, maxLength: 8192}
        nonce: {type: string, maxLength: 256}
        authorizationCode: {type: string, maxLength: 1024}
    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, maxLength: 320}
        invite: {$ref: "#/components/schemas/InviteProof"}
        admissionCode: {$ref: "#/components/schemas/AdmissionCode"}
        signUp: {$ref: "#/components/schemas/SignUp"}
        consent: {$ref: "#/components/schemas/Consent"}
    MagicLinkRedemption:
      type: object
      description: Either token alone (from the link), or email and code (typed).
      properties:
        token: {type: string, maxLength: 128}
        email: {type: string, maxLength: 320}
        code:
          type: string
          maxLength: 32
          description: |
            The 8 Crockford base32 characters from the mail. Read leniently: case,
            spaces and hyphens are ignored, O is read as 0 and I and L as 1.
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, maxLength: 320}
    EmailConfirmation:
      type: object
      description: Either code (typed) or token (from the link), not both.
      properties:
        code:
          type: string
          maxLength: 32
          description: |
            The 8 Crockford base32 characters from the mail, read as a sign-in code is.
        token: {type: string, maxLength: 128}
    PushTokenInput:
      type: object
      required: [platform, token]
      properties:
        platform: {type: string, enum: [apns, apns-sandbox, fcm]}
        token: {type: string, maxLength: 4096}
    FriendSettings:
      type: object
      required: [notifyDone]
      properties:
        notifyDone: {type: boolean}
    ClientErrorReport:
      type: object
      required: [kind, message]
      properties:
        kind: {type: string, enum: [crash, error]}
        message: {type: string, maxLength: 2048}
        appVersion: {type: string, maxLength: 64}
        osVersion: {type: string, maxLength: 64}
        context:
          type: object
          additionalProperties: {type: string, maxLength: 256}
          maxProperties: 20
    Nonce:
      type: object
      required: [nonce]
      properties:
        nonce: {type: string}
